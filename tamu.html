<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Tamu Digital - Rekap Admin SMAN 7 Tangerang Selatan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    @media print {
      body { background: white !important; p: 0 !important; }
      #btnLogin, #statusAdmin, #cariTamu, #btnExportPdf, #btnExportExcel, .no-print { display: none !important; }
      .shadow-xl, .shadow-2xl, .shadow-lg { box-shadow: none !important; }
      .border { border: 1px solid #ddd !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-6">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- HEADER -->
    <div class="bg-slate-900 text-white rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <img src="logo banten.jpeg" alt="Logo Banten" class="h-12 w-auto bg-white p-1 rounded-md shadow-sm" onerror="this.style.display='none'">
        <img src="logo sman7tangsel.jpeg" alt="Logo SMAN 7" class="h-12 w-auto bg-white p-1 rounded-md shadow-sm" onerror="this.style.display='none'">
        <div>
          <h1 class="text-xl font-bold">SMAN 7 Kota Tangerang Selatan</h1>
          <p class="text-xs text-slate-300">Panel Admin / Rekap Buku Tamu Digital</p>
        </div>
      </div>
      <button id="btnLogin" onclick="bukaModalLogin()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-semibold text-sm transition flex items-center gap-2 shadow-lg shadow-blue-500/20">
        <i class="fa-solid fa-lock"></i> Login Petugas
      </button>
      <div id="statusAdmin" class="hidden flex items-center gap-3">
        <span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Mode Admin
        </span>
        <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-medium transition">
          Logout
        </button>
      </div>
    </div>

    <!-- PANEL REKAP TAMU -->
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
      <div class="p-5 border-b border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
        <h2 class="font-bold text-slate-800 text-lg flex items-center gap-2">
          <i class="fa-solid fa-list-check text-blue-600"></i> Daftar Kunjungan Tamu (Live Online)
        </h2>
        
        <!-- FITUR CARI DAN TOMBOL EXPORT / PRINT -->
        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
          <input type="text" id="cariTamu" onkeyup="filterTamu()" placeholder="Cari nama/instansi..." class="w-full md:w-48 px-3.5 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 outline-none">
          
          <button id="btnExportPdf" onclick="cetakRekap()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-xl font-medium text-xs flex items-center gap-1.5 shadow-sm transition">
            <i class="fa-solid fa-file-pdf"></i> Cetak / PDF
          </button>
          
          <button id="btnExportExcel" onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl font-medium text-xs flex items-center gap-1.5 shadow-sm transition">
            <i class="fa-solid fa-file-excel"></i> Excel
          </button>
        </div>
      </div>

      <!-- TABEL DAFTAR TAMU -->
      <div class="overflow-x-auto">
        <table id="tabelUtama" class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-700 font-semibold text-xs">
              <th class="p-3.5">Tanggal & Waktu</th>
              <th class="p-3.5">Nama</th>
              <th class="p-3.5">Instansi</th>
              <th class="p-3.5">Tujuan</th>
              <th class="p-3.5">Keperluan</th>
              <th class="p-3.5 text-center no-print">Foto Bukti</th>
            </tr>
          </thead>
          <tbody id="tabelTamu">
            <tr>
              <td colspan="6" class="p-8 text-center text-slate-400 text-xs">
                <i class="fa-solid fa-spinner fa-spin text-lg mb-2 text-blue-600"></i><br>
                Memuat data kunjungan dari server...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- MODAL POPUP LIHAT FOTO -->
  <div id="modalFoto" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50 no-print">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden p-4 space-y-3 relative">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="judulFoto" class="font-bold text-slate-800 text-sm">Foto Bukti Kunjungan</h3>
        <button type="button" onclick="tutupModalFoto()" class="text-slate-400 hover:text-slate-600 font-bold text-2xl leading-none">&times;</button>
      </div>
      <div class="flex justify-center bg-slate-100 rounded-xl p-2 overflow-hidden max-h-[70vh]">
        <img id="imgModal" src="" alt="Foto Bukti" class="max-h-[65vh] object-contain rounded-lg shadow-sm">
      </div>
      <div class="text-right">
        <button type="button" onclick="tutupModalFoto()" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-lg">Tutup</button>
      </div>
    </div>
  </div>

  <!-- MODAL POPUP LOGIN PETUGAS -->
  <div id="modalLogin" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50 no-print">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-base font-bold text-slate-800">Login Petugas Sarpras</h3>
        <button type="button" onclick="tutupModalLogin()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Kata Sandi / PIN</label>
          <input type="password" id="inputPass" placeholder="Masukkan PIN" class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" onkeypress="handleEnter(event)">
        </div>
        <p id="pesanError" class="text-xs text-red-500 hidden">PIN yang Anda masukkan salah!</p>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="tutupModalLogin()" class="px-3 py-2 rounded-lg text-xs text-slate-600 hover:bg-slate-100">Batal</button>
        <button type="button" onclick="login()" class="px-4 py-2 bg-blue-900 hover:bg-blue-800 text-white rounded-lg text-xs font-medium">Masuk</button>
      </div>
    </div>
  </div>

  <script>
    const PIN_ADMIN = "admin123";
    const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbzp6IOtmLr6WJGHHrIERIK19Wun-GIkayBm8GJgWgzTmqDYHcCtFAZs_CsfuAOCutIg/exec";

    let globalDataTamu = [];

    document.addEventListener("DOMContentLoaded", function() {
      tampilkanDataTamu();
      setInterval(tampilkanDataTamu, 10000);
    });

    function tampilkanDataTamu() {
      fetch(URL_WEB_APP)
        .then(res => res.json())
        .then(data => {
          globalDataTamu = data;
          renderTabel(data);
        })
        .catch(err => {
          console.error("Gagal mengambil data:", err);
        });
    }

    function renderTabel(dataTamu) {
      const tbody = document.getElementById('tabelTamu');
      if (!tbody) return;

      if (!dataTamu || dataTamu.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="p-8 text-center text-slate-400">Belum ada data kunjungan.</td>
          </tr>
        `;
        return;
      }

      let html = '';
      dataTamu.forEach((item, index) => {
        html += `
          <tr class="border-b hover:bg-slate-50 transition">
            <td class="p-3.5 text-slate-500 font-mono text-xs">${item.waktu || '-'}</td>
            <td class="p-3.5 font-medium text-slate-800 text-xs">${item.nama || '-'}</td>
            <td class="p-3.5 text-slate-600 text-xs">${item.instansi || '-'}</td>
            <td class="p-3.5 text-slate-600 text-xs">${item.tujuan || '-'}</td>
            <td class="p-3.5 text-slate-600 text-xs">${item.keperluan || '-'}</td>
            <td class="p-3.5 text-center no-print">
              ${item.foto && item.foto.length > 20 
                ? `<button type="button" onclick="lihatFotoModal(${index})" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-blue-700 inline-flex items-center gap-1 shadow-sm"><i class="fa-solid fa-image"></i> Lihat Foto</button>` 
                : `<span class="text-slate-400 text-xs">-</span>`}
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    function cetakRekap() {
      window.print();
    }

    function exportExcel() {
      let table = document.getElementById("tabelUtama");
      let html = table.outerHTML;
      let url = 'data:application/vnd.ms-excel,' + encodeURIComponent(html);
      let downloadLink = document.createElement("a");
      document.body.appendChild(downloadLink);
      downloadLink.href = url;
      downloadLink.download = 'Rekap_Buku_Tamu_SMAN7.xls';
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }

    function lihatFotoModal(index) {
      const item = globalDataTamu[index];
      if (!item || !item.foto) return;

      document.getElementById('judulFoto').innerText = `Foto Bukti: ${item.nama} (${item.instansi})`;
      document.getElementById('imgModal').src = item.foto;
      
      const modal = document.getElementById('modalFoto');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function tutupModalFoto() {
      const modal = document.getElementById('modalFoto');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.getElementById('imgModal').src = '';
    }

    function bukaModalLogin() {
      document.getElementById('inputPass').value = '';
      document.getElementById('pesanError').classList.add('hidden');
      const modal = document.getElementById('modalLogin');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => document.getElementById('inputPass').focus(), 100);
    }

    function tutupModalLogin() {
      const modal = document.getElementById('modalLogin');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function handleEnter(e) {
      if (e.key === 'Enter') login();
    }

    function login() {
      const pass = document.getElementById('inputPass').value;
      if (pass === PIN_ADMIN) {
        document.getElementById('btnLogin').classList.add('hidden');
        document.getElementById('statusAdmin').classList.remove('hidden');
        tutupModalLogin();
        alert('Login Berhasil! Selamat datang Admin.');
      } else {
        document.getElementById('pesanError').classList.remove('hidden');
      }
    }

    function logout() {
      document.getElementById('btnLogin').classList.remove('hidden');
      document.getElementById('statusAdmin').classList.add('hidden');
    }

    function filterTamu() {
      const query = document.getElementById('cariTamu').value.toLowerCase();
      const filtered = globalDataTamu.filter(item => {
        return (item.nama && item.nama.toLowerCase().includes(query)) ||
               (item.instansi && item.instansi.toLowerCase().includes(query)) ||
               (item.tujuan && item.tujuan.toLowerCase().includes(query)) ||
               (item.keperluan && item.keperluan.toLowerCase().includes(query));
      });
      renderTabel(filtered);
    }
  </script>
</body>
</html>
