<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu - SMAN 7 Kota Tangerang Selatan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- Header Admin -->
        <header class="bg-blue-900 text-white p-6 rounded-xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-start">
                <img src="logo banten.jpeg" alt="Logo Banten" class="h-14 w-auto object-contain bg-white/20 p-1 rounded-lg">
                <div>
                    <h1 class="text-xl md:text-2xl font-bold">SMAN 7 Kota Tangerang Selatan</h1>
                    <p class="text-blue-200 text-xs md:text-sm">Panel Admin / Rekap Buku Tamu Digital</p>
                </div>
                <img src="logo sman7tangsel.jpeg" alt="Logo SMAN 7" class="h-14 w-auto object-contain bg-white/20 p-1 rounded-lg">
            </div>

            <!-- Tombol Status Login / Logout -->
            <div id="areaLogin" class="w-full md:w-auto flex justify-end">
                <button type="button" onclick="bukaModalLogin()" id="btnLogin" class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-lg text-sm transition font-medium">Login Petugas</button>
                <div id="statusAdmin" class="hidden flex items-center gap-2">
                    <span class="bg-green-500 text-white text-xs px-3 py-1.5 rounded-lg font-semibold">Petugas Aktif</span>
                    <button type="button" onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs transition">Logout</button>
                </div>
            </div>
        </header>

        <!-- Area Konten Utama -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <h2 class="text-lg font-semibold text-slate-800">Daftar Kunjungan Tamu (Live Online)</h2>
                <input type="text" id="cariTamu" onkeyup="filterTamu()" placeholder="Cari nama/instansi..." class="p-2 border rounded-lg text-sm w-full sm:w-64 outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Panel Kontrol Petugas -->
            <div id="panelAdmin" class="hidden bg-slate-50 p-3 rounded-lg border border-slate-200 flex flex-wrap gap-2 justify-between items-center">
                <span class="text-xs text-slate-500 font-medium">Panel Kontrol Petugas:</span>
                <div class="flex gap-2">
                    <button type="button" onclick="eksporExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">Unduh Excel (.xlsx)</button>
                </div>
            </div>

            <!-- Tabel Data Tamu -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b text-slate-600 font-medium">
                            <th class="p-3">Tanggal & Waktu</th>
                            <th class="p-3">Nama</th>
                            <th class="p-3">Instansi</th>
                            <th class="p-3">Tujuan</th>
                            <th class="p-3">Keperluan</th>
                        </tr>
                    </thead>
                    <tbody id="tabelTamu">
                        <tr>
                            <td colspan="5" class="p-8 text-center text-slate-400">Memuat data kunjungan dari server...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL POPUP LOGIN PETUGAS -->
    <div id="modalLogin" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-base font-bold text-slate-800">Login Petugas Sarpras</h3>
                <button type="button" onclick="tutupModalLogin()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Kata Sandi / PIN</label>
                    <input type="password" id="inputPass" placeholder="Masukkan PIN..." class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" onkeypress="handleEnter(event)">
                </div>
                <p id="pesanError" class="text-xs text-red-500 hidden">PIN yang Anda masukkan salah!</p>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="tutupModalLogin()" class="px-3 py-2 rounded-lg text-xs text-slate-600 hover:bg-slate-100">Batal</button>
                <button type="button" onclick="login()" class="px-4 py-2 bg-blue-900 hover:bg-blue-800 text-white rounded-lg text-xs font-medium">Masuk</button>
            </div>
        </div>
    </div>

    <script>
        const PIN_ADMIN = "admin123";
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbx9Vt-b0dl0cB8vmcR1ABDNL9fnueevdiOa3ym4I1D2devccmSyF5sPFptYySeLHrkBZA/exec";

        document.addEventListener("DOMContentLoaded", function() {
            tampilkanDataTamu();
            // Pemicu otomatis mengambil data baru dari server setiap 3 detik
            setInterval(tampilkanDataTamu, 3000);
        });

        function tampilkanDataTamu() {
            fetch(URL_WEB_APP)
                .then(res => res.json())
                .then(dataTamu => {
                    renderTabel(dataTamu);
                })
                .catch(err => console.error("Gagal mengambil data:", err));
        }

       function formatWaktuWIB(strWaktu) {
    if (!strWaktu) return '-';
    // Jika formatnya masih UTC (ada huruf Z atau T), konversi ke jam Indonesia
    if (strWaktu.includes('Z') || strWaktu.includes('T')) {
        const d = new Date(strWaktu);
        if (!isNaN(d.getTime())) {
            return d.toLocaleString('id-ID', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            }).replace(/\./g, ':');
        }
    }
    return strWaktu;
}

function renderTabel(dataTamu) {
    const tbody = document.getElementById('tabelTamu');
    if (!tbody) return;

    if (!dataTamu || dataTamu.length === 0) {
        tbody.innerHTML = `
            <tr>
               <td colspan="6" class="p-8 text-center text-slate-400">Belum ada data kunjungan.</td>
            </tr>
        `;
        return;
    }

    let html = '';
    dataTamu.forEach(item => {
        html += `
            <tr class="border-b hover:bg-slate-50 transition">
  <td class="p-3 text-slate-500 font-mono text-xs">${formatWaktuWIB(item.waktu)}</td>
  <td class="p-3 font-medium text-slate-800">${item.nama || '-'}</td>
  <td class="p-3 text-slate-600">${item.instansi || '-'}</td>
  <td class="p-3 text-slate-600">${item.tujuan || '-'}</td>
  <td class="p-3 text-slate-600">${item.keperluan || '-'}</td>
  <td class="p-3 text-center">
    ${item.foto && item.foto.length > 20 
      ? `<a href="${item.foto}" target="_blank" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg text-xs font-semibold hover:bg-blue-200 inline-flex items-center gap-1"><i class="fa-solid fa-image"></i> Lihat Foto</a>` 
      : `<span class="text-slate-400 text-xs">-</span>`}
  </td>
</tr>
        `;
    });
    tbody.innerHTML = html;
}

        function bukaModalLogin() {
            document.getElementById('inputPass').value = '';
            document.getElementById('pesanError').classList.add('hidden');
            const modal = document.getElementById('modalLogin');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => document.getElementById('inputPass').focus(), 100);
        }

        function tutupModalLogin() {
            const modal = document.getElementById('modalLogin');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function handleEnter(e) {
            if (e.key === 'Enter') login();
        }

        function login() {
            const pass = document.getElementById('inputPass').value;
            if (pass === PIN_ADMIN) {
                document.getElementById('btnLogin').classList.add('hidden');
                document.getElementById('statusAdmin').classList.remove('hidden');
                document.getElementById('panelAdmin').classList.remove('hidden');
                tutupModalLogin();
            } else {
                document.getElementById('pesanError').classList.remove('hidden');
            }
        }

        function logout() {
            document.getElementById('btnLogin').classList.remove('hidden');
            document.getElementById('statusAdmin').classList.add('hidden');
            document.getElementById('panelAdmin').classList.add('hidden');
        }

        function filterTamu() {
            const query = document.getElementById('cariTamu').value.toLowerCase();
            const rows = document.querySelectorAll('#tabelTamu tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(query) ? '' : 'none';
            });
        }

        function eksporExcel() {
            fetch(URL_WEB_APP)
                .then(res => res.json())
                .then(dataTamu => {
                    if (!dataTamu || dataTamu.length === 0) {
                        alert('Tidak ada data untuk diunduh.');
                        return;
                    }
                    const worksheet = XLSX.utils.json_to_sheet(dataTamu);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Data Tamu");
                    XLSX.writeFile(workbook, "Data_Kunjungan_Tamu_SMAN7.xlsx");
                });
        }
    </script>
</body>
</html>
