<script>
  // TEMPELKAN URL APPLIKASI WEB BARU DARI APPS SCRIPT DI SINI
  const APPS_SCRIPT_URL = "URL_WEB_APP_BARU_ANDA_DI_SINI";

  let fotoBase64 = "";

  function handleFotoPreview(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 400; // Ukuran kecil agar pengiriman sangat cepat
          const scaleSize = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          fotoBase64 = canvas.toDataURL('image/jpeg', 0.5);
          document.getElementById('imgPreview').src = fotoBase64;
          document.getElementById('previewBox').classList.remove('hidden');
        };
      };
      reader.readAsDataURL(file);
    }
  }

  function submitGuestData(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim Data...';

    const formData = new URLSearchParams();
    formData.append('waktu', new Date().toLocaleString('id-ID'));
    formData.append('nama', document.getElementById('nama').value);
    formData.append('instansi', document.getElementById('instansi').value);
    formData.append('tujuan', document.getElementById('tujuan').value);
    formData.append('keperluan', document.getElementById('keperluan').value);
    formData.append('foto', fotoBase64);

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      if(data.result === 'success') {
        alert('Terima kasih! Data kunjungan Anda berhasil dikirim.');
        document.getElementById('guestForm').reset();
        document.getElementById('previewBox').classList.add('hidden');
        fotoBase64 = "";
      } else {
        alert('Gagal menyimpan: ' + data.message);
      }
    })
    .catch(err => {
      alert('Terima kasih! Data sedang diproses.');
      document.getElementById('guestForm').reset();
      document.getElementById('previewBox').classList.add('hidden');
      fotoBase64 = "";
    })
    .finally(() => {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Data Kunjungan';
    });
  }
</script>
