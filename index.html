<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang di SMAN 7 Kota Tangerang Selatan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-800 text-white p-6 text-center space-y-2">
            <div class="flex items-center justify-between gap-2">
                <img src="logo banten.jpeg" alt="Logo Banten" class="h-12 w-auto object-contain bg-white/20 p-1 rounded-lg">
                <div>
                    <h1 class="text-xl font-bold">Selamat Datang</h1>
                    <p class="text-xs text-blue-200 font-medium">SMAN 7 Kota Tangerang Selatan</p>
                </div>
                <img src="logo sman7tangsel.jpeg" alt="Logo SMAN 7" class="h-12 w-auto object-contain bg-white/20 p-1 rounded-lg">
            </div>
            <p class="text-xs text-blue-100 pt-2 border-t border-blue-700/50">Silakan isi formulir kunjungan di bawah ini</p>
        </div>

        <!-- Form Tamu -->
        <form id="formTamu" class="p-6 space-y-4" onsubmit="simpanData(event)">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap <span class="text-red-500">*</span></label>
                <input type="text" id="nama" required placeholder="Masukkan nama Anda" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Instansi / Asal <span class="text-red-500">*</span></label>
                <input type="text" id="instansi" required placeholder="Contoh: Orang Tua Murid / Dinas Pendidikan" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Bertemu Dengan <span class="text-red-500">*</span></label>
                <input type="text" id="tujuan" required placeholder="Contoh: Kepala Sekolah / Guru BK / Tata Usaha" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Maksud & Keperluan <span class="text-red-500">*</span></label>
                <textarea id="keperluan" required rows="3" placeholder="Tuliskan keperluan kunjungan Anda..." class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-600 resize-none"></textarea>
            </div>

            <button type="submit" id="btnSubmit" class="w-full py-3 bg-blue-700 hover:bg-blue-800 text-white font-semibold rounded-lg text-sm shadow-md transition duration-200">Kirim Data Kunjungan</button>
        </form>
    </div>

    <script>
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbx9Vt-b0dl0cB8vmcR1ABDNL9fnueevdiOa3ym4I1D2devccmSyF5sPFptYySeLHrkBZA/exec";

        function simpanData(e) {
            e.preventDefault();

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            const skrg = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const timestamp = `${pad(skrg.getDate())}/${pad(skrg.getMonth()+1)}/${skrg.getFullYear()}, ${pad(skrg.getHours())}:${pad(skrg.getMinutes())}:${pad(skrg.getSeconds())}`;

            const dataBaru = {
                waktu: timestamp,
                nama: document.getElementById('nama').value,
                instansi: document.getElementById('instansi').value,
                tujuan: document.getElementById('tujuan').value,
                keperluan: document.getElementById('keperluan').value
            };

            fetch(URL_WEB_APP, {
                method: 'POST',
                body: JSON.stringify(dataBaru)
            })
            .then(res => res.json())
            .then(res => {
                alert('Terima kasih! Data kunjungan Anda berhasil dikirim.');
                document.getElementById('formTamu').reset();
            })
            .catch(err => {
                alert('Gagal mengirim data. Pastikan koneksi internet aktif.');
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Kirim Data Kunjungan";
            });
        }
    </script>
</body>
</html>
